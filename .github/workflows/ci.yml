name: QMoosa Repository Integrity

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f README.md
          test -f .gitignore
          test -f QMOOSA_TRUTH_PROTOCOL.md
          test -f ANTIGRAVITY.md

  application-evidence:
    needs: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build application
        run: npm run build
      - name: Test repository and application
        run: npm test
      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

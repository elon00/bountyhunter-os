name: QMoosa Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify security baseline
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f SECURITY_STATUS.md
          test -f QMOOSA_TRUTH_PROTOCOL.md
          test -f ANTIGRAVITY.md
          grep -qx '.env' .gitignore
          grep -qx '.env.local' .gitignore
      - name: Reality status
        run: |
          echo "Repository integrity verified."
          echo "Production readiness requires application-specific evidence."

  application-evidence:
    name: Application Evidence
    needs: repository-integrity
    if: ${{ hashFiles('app/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run lint --if-present
      - working-directory: app
        run: npm run build --if-present
      - working-directory: app
        run: npm test --if-present

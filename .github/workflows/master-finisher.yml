name: QMoosa Master Finisher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-finisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run evidence-gated finisher
        run: npm run qmoosa:finish

      - name: Upload finisher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmoosa-master-finisher-report
          path: .qmoosa/master-finisher-report.json
          if-no-files-found: ignore
